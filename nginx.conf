server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Coolify's proxy: keep redirects relative so https is preserved.
    absolute_redirect off;

    # Password protection for everything...
    auth_basic "Private content";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Keep these pages out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;

    # ...except the health check used by Docker/Coolify.
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /mypage1 -> mypage1.html, or mypage1/index.html (folder with assets)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
