<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin login</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2e2dd; --accent:#2f5bea; --danger:#c0362c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1e1e1c; --fg:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#7b9bff; --danger:#ff7b70; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .card { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
  .mark { width:36px; height:36px; border-radius:9px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; margin-bottom:16px; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 20px; font-size:.92rem; }
  label { display:block; font-size:.82rem; font-weight:600; margin-bottom:4px; }
  input { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
          background:var(--bg); color:var(--fg); margin-bottom:14px; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { width:100%; font:inherit; font-weight:600; padding:10px; border:0; border-radius:8px;
           background:var(--accent); color:#fff; cursor:pointer; margin-top:4px; }
  .error { color:var(--danger); font-size:.9rem; margin:-4px 0 12px; }
</style>
</head>
<body>
<main class="card">
  <div class="mark">C</div>
  <h1>Content admin</h1>
  <p>Log in to manage your pages.</p>
  <form method="post" action="/admin/login">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <!--ERROR-->
    <button>Log in</button>
  </form>
</main>
</body>
</html>
