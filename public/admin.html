<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Content admin</title>
<style>
  :root {
    --bg:#f6f6f4; --card:#fff; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2e2dd; --soft:#f0f0ec;
    --accent:#2f5bea; --accent-fg:#fff; --danger:#c0362c; --ok:#1f8a4c; --warn-bg:#fff4d6; --warn-fg:#6b4d00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#141413; --card:#1e1e1c; --fg:#ececea; --muted:#9a9a94; --line:#33332f; --soft:#262624;
      --accent:#7b9bff; --accent-fg:#0d1530; --danger:#ff7b70; --ok:#5fd394; --warn-bg:#3a2f10; --warn-fg:#ffd98a;
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.05rem; }
  .mark { width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--accent-fg); display:grid; place-items:center; }
  h2 { font-size:1rem; margin:0 0 14px; display:flex; align-items:center; gap:8px; }
  .count { color:var(--muted); font-weight:500; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:18px; }
  .banner { background:var(--warn-bg); color:var(--warn-fg); border-radius:10px; padding:12px 14px; margin-bottom:18px; font-size:.92rem; }
  label.f { display:block; font-size:.8rem; font-weight:600; margin:14px 0 4px; }
  .hint { font-weight:400; color:var(--muted); }
  input[type=text], input[type=password], textarea {
    width:100%; font:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg);
  }
  input:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  textarea { min-height:180px; font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; resize:vertical; }
  button { font:inherit; font-size:.88rem; font-weight:600; padding:8px 12px; border-radius:8px; cursor:pointer;
           border:1px solid var(--line); background:var(--card); color:var(--fg); white-space:nowrap; }
  button:hover { background:var(--soft); }
  button.primary { background:var(--accent); color:var(--accent-fg); border-color:transparent; padding:10px 18px; }
  button.primary:hover { filter:brightness(1.08); background:var(--accent); }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.55; cursor:default; }
  .tabs { display:inline-flex; background:var(--soft); border-radius:9px; padding:3px; margin-bottom:12px; }
  .tabs button { border:0; background:transparent; padding:6px 12px; color:var(--muted); }
  .tabs button.on { background:var(--card); color:var(--fg); box-shadow:0 1px 2px #0002; }
  .drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:120px;
          border:1.5px dashed var(--line); border-radius:10px; padding:16px; text-align:center; cursor:pointer; color:var(--muted); }
  .drop.over, .drop:hover { border-color:var(--accent); color:var(--fg); }
  .drop.has { border-style:solid; color:var(--fg); }
  .drop input { display:none; }
  .drop strong { color:var(--fg); }
  .slug { display:flex; align-items:stretch; border:1px solid var(--line); border-radius:8px; background:var(--bg); overflow:hidden; }
  .slug:focus-within { outline:2px solid var(--accent); outline-offset:-1px; }
  .slug .host { padding:9px 0 9px 11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:45%; }
  .slug input { border:0; border-radius:0; padding-left:2px; min-width:0; flex:1; outline:none !important; }
  .slug button { border:0; border-left:1px solid var(--line); border-radius:0; background:transparent; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .actions-row { display:flex; align-items:center; gap:12px; margin-top:18px; flex-wrap:wrap; }
  .msg { font-size:.9rem; }
  .msg.err { color:var(--danger); }
  .msg.ok { color:var(--ok); }
  .msg a { color:inherit; font-weight:600; }
  ul { list-style:none; margin:0; padding:0; }
  li.page { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  li.page:first-child { border-top:0; padding-top:0; }
  .info { flex:1; min-width:0; }
  .info a.t { color:var(--fg); font-weight:600; text-decoration:none; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .info a.t:hover { color:var(--accent); }
  .sub { color:var(--muted); font-size:.82rem; display:flex; flex-wrap:wrap; gap:4px 10px; }
  .sub code { font:inherit; color:var(--fg); }
  .badge { font-size:.72rem; font-weight:600; padding:1px 7px; border-radius:99px; background:var(--soft); color:var(--fg); }
  .acts { display:flex; gap:6px; }
  .empty { color:var(--muted); font-size:.92rem; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--fg); padding:22px; width:min(460px, calc(100vw - 32px)); }
  dialog::backdrop { background:#0006; }
  dialog h2 { margin-bottom:4px; }
  .check { display:flex; align-items:center; gap:8px; font-size:.88rem; margin-top:8px; }
  .file-line { display:flex; align-items:center; gap:10px; font-size:.88rem; color:var(--muted); }
  @media (max-width: 640px) {
    .grid { grid-template-columns:1fr; }
    li.page { flex-direction:column; align-items:stretch; gap:8px; }
    .acts button { flex:1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="mark">C</div><span id="hostName">Content</span></div>
    <form method="post" action="/admin/logout"><button>Log out</button></form>
  </header>

  <div id="warn" class="banner" hidden></div>

  <section class="card">
    <h2>New page</h2>
    <form id="create" autocomplete="off">
      <div class="tabs" role="tablist">
        <button type="button" data-tab="file" class="on">Upload file</button>
        <button type="button" data-tab="paste">Paste HTML</button>
      </div>
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".html,.htm,text/html">
        <span id="dropText"><strong>Drop an .html file here</strong><br>or click to choose</span>
      </label>
      <textarea id="paste" hidden placeholder="<!doctype html>&#10;<html>…"></textarea>

      <label class="f" for="slug">URL <span class="hint">— leave empty for a random one</span></label>
      <div class="slug">
        <span class="host"></span>
        <input type="text" id="slug" placeholder="my-page" maxlength="64" spellcheck="false">
        <button type="button" id="gen">Random</button>
      </div>

      <div class="grid">
        <div>
          <label class="f" for="title">Title <span class="hint">— optional</span></label>
          <input type="text" id="title" placeholder="Taken from the page’s &lt;title&gt;">
        </div>
        <div>
          <label class="f" for="pw">Viewer password <span class="hint">— optional</span></label>
          <input type="text" id="pw" placeholder="Empty = anyone with the link">
        </div>
      </div>

      <div class="actions-row">
        <button class="primary" id="publish">Publish</button>
        <span id="createMsg" class="msg" aria-live="polite"></span>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>Pages <span class="count" id="count"></span></h2>
    <ul id="list"></ul>
    <p class="empty" id="empty" hidden>No pages yet. Publish one above.</p>
  </section>
</div>

<dialog id="edit">
  <form id="editForm" method="dialog" autocomplete="off">
    <h2>Edit page</h2>
    <label class="f" for="eSlug">URL</label>
    <div class="slug"><span class="host"></span><input type="text" id="eSlug" maxlength="64" spellcheck="false" required></div>

    <label class="f" for="eTitle">Title</label>
    <input type="text" id="eTitle">

    <label class="f" for="ePw">Viewer password</label>
    <input type="text" id="ePw" placeholder="">
    <label class="check" id="eRemoveWrap"><input type="checkbox" id="eRemove"> Remove password (make public)</label>

    <label class="f">Content</label>
    <div class="file-line">
      <button type="button" id="eChoose">Replace HTML…</button>
      <span id="eFileName">Keep current</span>
      <input type="file" id="eFile" accept=".html,.htm,text/html" hidden>
    </div>

    <div class="actions-row">
      <button class="primary" value="save" id="eSave">Save</button>
      <button type="button" id="eCancel">Cancel</button>
      <span id="editMsg" class="msg err"></span>
    </div>
  </form>
</dialog>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const host = location.host;
  document.querySelectorAll('.host').forEach((e) => (e.textContent = host + '/'));
  $('#hostName').textContent = host;

  const ALPHA = 'abcdefghijkmnpqrstuvwxyz23456789';
  const randomSlug = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => ALPHA[b % ALPHA.length]).join('');
  const cleanSlug = (v) => v.toLowerCase().replace(/[\s_]+/g, '-').replace(/[^a-z0-9-]/g, '').slice(0, 64);
  const fmtSize = (n) => (n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB');
  const fmtDate = (s) => new Date(s).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  const pageUrl = (slug) => location.origin + '/' + slug;

  async function api(method, url, body) {
    const r = await fetch(url, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (r.status === 401) { location.reload(); throw new Error('Logged out.'); }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Error ' + r.status);
    return data;
  }

  function setMsg(el, text, kind) {
    el.className = 'msg' + (kind ? ' ' + kind : '');
    el.textContent = text;
  }

  async function copy(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
      const old = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => (btn.textContent = old), 1200);
    } catch { prompt('Copy this link:', text); }
  }

  // ----- status banner -----
  api('GET', '/admin/api/status').then((s) => {
    if (!s.dataIsMounted) {
      const w = $('#warn');
      w.textContent = 'Storage is not persistent: /data isn’t a mounted volume, so uploaded pages will be lost on the next redeploy. Add a Persistent Storage volume at /data in Coolify.';
      w.hidden = false;
    }
  }).catch(() => {});

  // ----- create form -----
  let mode = 'file';
  let fileHtml = null;
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
    mode = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    $('#drop').hidden = mode !== 'file';
    $('#paste').hidden = mode !== 'paste';
  }));

  async function takeFile(f) {
    if (!f) return;
    fileHtml = await f.text();
    const d = $('#drop');
    d.classList.add('has');
    $('#dropText').innerHTML = '';
    const strong = document.createElement('strong');
    strong.textContent = f.name;
    $('#dropText').append(strong, document.createElement('br'), fmtSize(f.size) + ' · click to change');
  }
  $('#file').addEventListener('change', (e) => takeFile(e.target.files[0]));
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, () => drop.classList.remove('over')));
  drop.addEventListener('drop', (e) => { e.preventDefault(); takeFile(e.dataTransfer.files[0]); });

  $('#gen').addEventListener('click', () => { $('#slug').value = randomSlug(); });
  for (const id of ['#slug', '#eSlug']) {
    $(id).addEventListener('input', (e) => { const v = cleanSlug(e.target.value); if (v !== e.target.value) e.target.value = v; });
  }

  $('#create').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = $('#createMsg');
    const html = mode === 'file' ? fileHtml : $('#paste').value;
    if (!html || !html.trim()) return setMsg(msg, mode === 'file' ? 'Choose an HTML file first.' : 'Paste some HTML first.', 'err');
    $('#publish').disabled = true;
    setMsg(msg, 'Publishing…');
    try {
      const { page } = await api('POST', '/admin/api/pages', {
        html,
        slug: $('#slug').value.replace(/^-+|-+$/g, ''),
        title: $('#title').value,
        password: $('#pw').value,
      });
      msg.className = 'msg ok';
      msg.textContent = 'Published: ';
      const a = document.createElement('a');
      a.href = pageUrl(page.slug); a.target = '_blank'; a.rel = 'noopener'; a.textContent = host + '/' + page.slug;
      const c = document.createElement('button');
      c.type = 'button'; c.textContent = 'Copy link'; c.style.marginLeft = '8px';
      c.onclick = () => copy(pageUrl(page.slug), c);
      msg.append(a, c);
      e.target.reset();
      fileHtml = null;
      $('#drop').classList.remove('has');
      $('#dropText').innerHTML = '<strong>Drop an .html file here</strong><br>or click to choose';
      load();
    } catch (err) {
      setMsg(msg, err.message, 'err');
    } finally {
      $('#publish').disabled = false;
    }
  });

  // ----- list -----
  let current = [];
  async function load() {
    try {
      const { pages } = await api('GET', '/admin/api/pages');
      current = pages;
      render();
    } catch (err) {
      $('#empty').hidden = false;
      $('#empty').textContent = 'Could not load pages: ' + err.message;
    }
  }

  function el(tag, props = {}, ...kids) {
    const n = Object.assign(document.createElement(tag), props);
    n.append(...kids);
    return n;
  }

  function render() {
    const list = $('#list');
    list.innerHTML = '';
    $('#count').textContent = current.length ? String(current.length) : '';
    $('#empty').hidden = current.length > 0;
    $('#empty').textContent = 'No pages yet. Publish one above.';
    for (const p of current) {
      const sub = el('div', { className: 'sub' },
        el('code', { textContent: '/' + p.slug }),
        el('span', { textContent: 'Updated ' + fmtDate(p.updatedAt) }),
        el('span', { textContent: p.views + (p.views === 1 ? ' view' : ' views') }),
        el('span', { textContent: fmtSize(p.size) }),
      );
      if (p.hasPassword) sub.append(el('span', { className: 'badge', textContent: 'Password' }));
      const copyBtn = el('button', { type: 'button', textContent: 'Copy link' });
      copyBtn.onclick = () => copy(pageUrl(p.slug), copyBtn);
      const editBtn = el('button', { type: 'button', textContent: 'Edit' });
      editBtn.onclick = () => openEdit(p);
      const delBtn = el('button', { type: 'button', className: 'danger', textContent: 'Delete' });
      delBtn.onclick = async () => {
        if (!confirm('Delete /' + p.slug + '? This can’t be undone.')) return;
        try { await api('DELETE', '/admin/api/pages/' + encodeURIComponent(p.slug)); load(); }
        catch (err) { alert(err.message); }
      };
      list.append(el('li', { className: 'page' },
        el('div', { className: 'info' },
          el('a', { className: 't', href: '/' + p.slug, target: '_blank', rel: 'noopener', textContent: p.title || p.slug }),
          sub),
        el('div', { className: 'acts' }, copyBtn, editBtn, delBtn)));
    }
  }

  // ----- edit dialog -----
  const dlg = $('#edit');
  let editing = null;
  let editHtml = null;
  function openEdit(p) {
    editing = p;
    editHtml = null;
    $('#eSlug').value = p.slug;
    $('#eTitle').value = p.title;
    $('#ePw').value = '';
    $('#ePw').placeholder = p.hasPassword ? 'Leave empty to keep current password' : 'Empty = anyone with the link';
    $('#eRemove').checked = false;
    $('#eRemoveWrap').hidden = !p.hasPassword;
    $('#eFileName').textContent = 'Keep current';
    $('#eFile').value = '';
    $('#editMsg').textContent = '';
    dlg.showModal();
  }
  $('#eChoose').onclick = () => $('#eFile').click();
  $('#eFile').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    editHtml = await f.text();
    $('#eFileName').textContent = f.name + ' · ' + fmtSize(f.size);
  });
  $('#eRemove').addEventListener('change', (e) => { $('#ePw').disabled = e.target.checked; });
  $('#eCancel').onclick = () => dlg.close();
  $('#editForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {};
    const slug = $('#eSlug').value.replace(/^-+|-+$/g, '');
    if (slug !== editing.slug) body.slug = slug;
    if ($('#eTitle').value.trim() !== editing.title) body.title = $('#eTitle').value;
    if ($('#eRemove').checked) body.password = null;
    else if ($('#ePw').value) body.password = $('#ePw').value;
    if (editHtml !== null) body.html = editHtml;
    if (!Object.keys(body).length) return dlg.close();
    $('#eSave').disabled = true;
    try {
      await api('PATCH', '/admin/api/pages/' + encodeURIComponent(editing.slug), body);
      dlg.close();
      load();
    } catch (err) {
      $('#editMsg').textContent = err.message;
    } finally {
      $('#eSave').disabled = false;
      $('#ePw').disabled = false;
    }
  });

  load();
})();
</script>
</body>
</html>
